    let matriz = [
        [-20, -4, -1],
        [  1,  4,  7], 
        [  8, 10, 12]]
    let filas = matriz.length;
    let columnas = matriz[0].length;
    function up_down_col_sort(list) {
        let matriz_ordenada = JSON.parse(JSON.stringify(list));
        for(let i = 0; i < columnas ;i++) {
            for(let j = 0; j < filas-1; j++){
                for(let k = 0; k < filas-1- j; k++){
                    if(matriz_ordenada[k][i] > matriz_ordenada[k+1][i]){
                        let almacen = matriz_ordenada[k][i];
                        matriz_ordenada[k][i] = matriz_ordenada[k + 1][i]
                        matriz_ordenada[k + 1][i] =  almacen
                    }
                }
            }
        }
        return matriz_ordenada;
    }
    alert(JSON.stringify(up_down_col_sort(matriz)))
